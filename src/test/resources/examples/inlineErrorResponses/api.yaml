openapi: 3.0.3
info:
  title: Inline error responses
  version: 1.0.0
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Widget found
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '404':
          description: Widget not found
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
        '422':
          description: Validation problems
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
        default:
          description: Unexpected problem
          content:
            application/json:
              schema:
                title: FallbackProblem
                type: object
                required: [message]
                properties:
                  message:
                    type: string
