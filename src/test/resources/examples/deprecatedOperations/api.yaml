openapi: 3.1.0
info:
  title: Deprecated operations
  version: 1.0.0
paths:
  /subjects/{id}:
    get:
      operationId: findSubject
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          deprecated: true
          schema:
            type: string
      responses:
        '200':
          description: Found subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
    post:
      operationId: replaceSubject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subject'
      responses:
        '204':
          description: Replaced subject
components:
  schemas:
    Subject:
      type: object
      required:
        - id
      properties:
        id:
          type: string
